<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Stall - Live TV Display</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            neutral: {
              850: '#121824',
              900: '#0d1117',
              950: '#06090e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-neutral-950 text-slate-100 min-h-screen flex flex-col justify-center font-sans antialiased selection:bg-slate-700 selection:text-white p-6 md:p-12">

  <main class="max-w-6xl w-full mx-auto space-y-12">

    <!-- Active Call / Playing Box -->
    <div class="space-y-4">
      <span class="text-sm font-bold tracking-widest text-emerald-500 uppercase block text-center">Now Called / Playing</span>
      <div id="tvCurrentCall" class="p-12 md:p-16 bg-neutral-900/60 rounded-2xl border border-slate-850 text-center flex flex-col items-center justify-center min-h-[300px] space-y-4">
        <span class="text-slate-500 text-lg">No active player called</span>
      </div>
    </div>

    <!-- Up Next Queue -->
    <div class="space-y-4">
      <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase block text-center">Up Next</span>
      <div id="tvUpNext" class="p-8 bg-neutral-900/30 rounded-2xl border border-slate-850/60 text-center flex items-center justify-center min-h-[160px]">
        <span class="text-slate-500 text-sm">Queue is currently empty</span>
      </div>
    </div>

  </main>


  <script>
    const SUPABASE_URL = "https://ssfnesygrowenbtbuvvp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hXXphammunfQv_ptO7lU3g_Mb22PYHI";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    let queue = [];

    async function loadDisplayQueue() {
      const { data, error } = await db.from('queue_entries')
        .select('id,name,ticket,status,created_at')
        .in('status', ['waiting', 'called', 'in-progress'])
        .order('created_at', { ascending: true });
      if (error) {
        console.error('Queue display load failed:', error);
        document.getElementById('tvUpNext').innerHTML =
          '<span class="text-sm text-rose-400">Unable to connect to the live queue</span>';
        return;
      }
      queue = data || [];
      renderDisplay();
    }

    function renderDisplay() {
      const tvCall = document.getElementById('tvCurrentCall');
      const tvNext = document.getElementById('tvUpNext');
      const current = queue.find(p => p.status === 'called' || p.status === 'in-progress');
      const upNextList = queue.filter(p => p.status === 'waiting').slice(0, 6);
      if (current) {
        tvCall.innerHTML = `
          <div class="text-xs font-semibold text-emerald-500 tracking-widest uppercase">TICKET NUMBER</div>
          <div class="text-7xl md:text-8xl font-extrabold font-mono text-emerald-400 tracking-tight">#${current.ticket}</div>
          <div class="text-2xl md:text-3xl font-bold text-slate-100">${escapeHtml(current.name)}</div>`;
      } else {
        tvCall.innerHTML = '<span class="text-lg text-slate-500">No active player called</span>';
      }
      if (upNextList.length) {
        tvNext.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 w-full">
          ${upNextList.map(p => `<div class="p-4 bg-neutral-900 rounded-xl border border-slate-850 text-center space-y-1">
            <div class="text-3xl font-extrabold font-mono text-slate-200">#${p.ticket}</div>
            <div class="text-xs text-slate-400 truncate">${escapeHtml(p.name)}</div>
          </div>`).join('')}</div>`;
      } else {
        tvNext.innerHTML = '<span class="text-sm text-slate-500">Queue is currently empty</span>';
      }
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    db.channel('stall-queue-tv')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'queue_entries' }, loadDisplayQueue)
      .subscribe();

    loadDisplayQueue();
  </script>

</body>
</html>
